spring.application.name=splitease

# In-memory H2 in PostgreSQL mode; GROUPS/USER are keywords in H2 but valid table names in Postgres
spring.datasource.url=jdbc:h2:mem:splitease;MODE=PostgreSQL;NON_KEYWORDS=GROUPS,USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only signing key (base64 of a 32+ byte string)
jwt.secret=c3BsaXRlYXNlLXRlc3Qtc2VjcmV0LWtleS0xMjM0NTY3ODkwLWFiY2RlZg==

# Firebase needs real credentials; tests mock NotificationService instead
firebase.enabled=false
